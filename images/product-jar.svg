<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <!-- Background glow & gradients -->
    <radialGradient id="jarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>
    
    <!-- Lid gradient -->
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D1A06" />
      <stop offset="50%" stop-color="#632C0D" />
      <stop offset="100%" stop-color="#2A1204" />
    </linearGradient>
    
    <!-- Peanut Butter Texture Gradient -->
    <linearGradient id="pbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="40%" stop-color="#C26105" />
      <stop offset="80%" stop-color="#9A4503" />
      <stop offset="100%" stop-color="#783305" />
    </linearGradient>

    <!-- Glass Reflection Gradient -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>

    <!-- Label Gradient -->
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <!-- Header Banner Gradient -->
    <linearGradient id="headerBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="50%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>

    <!-- Crunch Badge Gradient -->
    <linearGradient id="crunchBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#5A2D0C" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="280" r="210" fill="url(#jarGlow)" />

  <!-- Shadow -->
  <ellipse cx="250" cy="485" rx="150" ry="22" fill="#5A2D0C" opacity="0.25" filter="blur(6px)" />

  <!-- Main Jar Group -->
  <g filter="url(#dropShadow)">
    
    <!-- Glass Jar Outer Body -->
    <rect x="125" y="140" width="250" height="320" rx="30" fill="url(#pbGrad)" />
    
    <!-- Peanut Crunch Pieces inside texture -->
    <circle cx="160" cy="180" r="5" fill="#78350F" opacity="0.6"/>
    <circle cx="185" cy="220" r="7" fill="#FEF3C7" opacity="0.7"/>
    <circle cx="310" cy="190" r="6" fill="#B45309" opacity="0.8"/>
    <circle cx="340" cy="240" r="4" fill="#78350F" opacity="0.7"/>
    <circle cx="150" cy="380" r="8" fill="#FDE68A" opacity="0.6"/>
    <circle cx="330" cy="400" r="7" fill="#78350F" opacity="0.7"/>
    <circle cx="280" cy="420" r="5" fill="#FEF3C7" opacity="0.8"/>
    <path d="M190 390 Q195 385 200 395" stroke="#78350F" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M300 170 Q305 165 310 175" stroke="#FEF3C7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Jar Neck -->
    <rect x="155" y="110" width="190" height="35" rx="6" fill="#783305" />
    
    <!-- Lid -->
    <rect x="145" y="65" width="210" height="50" rx="10" fill="url(#lidGrad)" />
    <!-- Lid Ridges -->
    <path d="M155 75 v30 M170 75 v30 M185 75 v30 M200 75 v30 M215 75 v30 M230 75 v30 M245 75 v30 M260 75 v30 M275 75 v30 M290 75 v30 M305 75 v30 M320 75 v30 M335 75 v30 M345 75 v30" stroke="#8B4513" stroke-width="2" opacity="0.4" />
    <!-- Lid Highlight -->
    <rect x="155" y="70" width="190" height="6" rx="3" fill="#ffffff" opacity="0.25" />

    <!-- Product Label -->
    <g transform="translate(135, 175)">
      <!-- Label Background -->
      <rect x="0" y="0" width="230" height="230" rx="14" fill="url(#labelGrad)" stroke="#D97706" stroke-width="2" />
      
      <!-- Top Brand Header Banner -->
      <rect x="0" y="0" width="230" height="55" rx="14" fill="url(#headerBanner)" />
      <!-- Square bottom edges for header banner -->
      <rect x="0" y="35" width="230" height="20" fill="url(#headerBanner)" />

      <!-- Brand Name -->
      <text x="115" y="36" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="26" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">PROTINUT</text>
      <text x="115" y="49" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#FDE68A" text-anchor="middle" letter-spacing="2">FOODS</text>

      <!-- Product Name -->
      <text x="115" y="85" font-family="'Outfit', sans-serif" font-weight="800" font-size="21" fill="#7C2D12" text-anchor="middle">PEANUT BUTTER</text>
      
      <!-- Flavor Divider -->
      <line x1="30" y1="96" x2="200" y2="96" stroke="#EA580C" stroke-width="2" stroke-dasharray="4,4" />
      
      <!-- Classy Crunch Banner -->
      <rect x="25" y="105" width="180" height="34" rx="17" fill="url(#crunchBadge)" />
      <text x="115" y="128" font-family="'Outfit', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CLASSY CRUNCH</text>
      
      <!-- Subtitle Details -->
      <text x="115" y="160" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#78350F" text-anchor="middle">Made with Roasted Peanuts</text>
      <text x="115" y="174" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#78350F" text-anchor="middle">&amp; Real Peanut Crunch</text>
      
      <!-- Net Weight / Quality Pills -->
      <rect x="35" y="190" width="75" height="22" rx="11" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
      <text x="72.5" y="204" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5" fill="#9A3412" text-anchor="middle">HIGH PROTEIN</text>

      <rect x="120" y="190" width="75" height="22" rx="11" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
      <text x="157.5" y="204" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5" fill="#9A3412" text-anchor="middle">100% QUALITY</text>
    </g>

    <!-- Glass Reflection Layer -->
    <rect x="125" y="140" width="250" height="320" rx="30" fill="url(#glassReflect)" pointer-events="none" />
    <path d="M140 150 Q 145 300 145 440" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.3" fill="none"/>
  </g>
</svg>
